name: .NET Module 10 CI/CD

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Run API tests
        # assumes API tests emit results to the folder specified below
        run: |
          mkdir -p test-results/api
          dotnet test --logger "trx;LogFileName=api-test-results.trx" --results-directory test-results/api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/api

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: api-tests
    # ensure UI job runs even if API job failed
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libgconf-2-4
          sudo apt-get install -y google-chrome-stable
          google-chrome --version || true

      - name: Restore
        run: dotnet restore

      - name: Run UI tests
        continue-on-error: false
        run: |
          mkdir -p test-results/ui screenshots
          # run UI tests and collect trx results; adjust filter if projects separate
          dotnet test --logger "trx;LogFileName=ui-test-results.trx" --results-directory test-results/ui

      - name: Upload UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: |
            test-results/ui
            screenshots

